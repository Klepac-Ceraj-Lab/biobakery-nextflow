# Harvard HSPH / FASRC (Cannon) params — biobakery-workflows-nextflow 0.0.3
#
# These are the settings the harvard_rc profile actually uses. Other sites'
# examples were removed so there is a single, current reference; set your own
# paths if you are not on FASRC.
#
# Tool stack:
#   KneadData  0.12.0-devel   rocky8/kneaddata/0.12.0-devel
#   MetaPhlAn  4.0.6_vOct22   rocky8/metaphlan4/4.0.6_vOct22_fixed
#   HUMAnN     4.0-alpha-1    rocky8/humann4/4.0-alpha-1-final
#   BAQLaVa    1.2.0          rocky8/baqlava/1.2.0-devel      (optional)
#   assembly   v3.2 stack     rocky8/biobakeryworkflows/3.2   (megahit, metabat2,
#                                                              checkm2, phylophlan,
#                                                              mash, fastANI)
#
# The MetaPhlAn vOct22 database is deliberate: HUMAnN 4 is not yet compatible
# with the vJan25 database. Do not switch this to metaphlan_4/4.2, which is also
# python3.12 and conflicts with the python3.10 stack used here.
#
# Prerequisites:
#   source /n/lab_storage/huttenhower_lab/tools/hutlab/src/hutlabrc_rocky8.sh
#   hutlab load rocky8/biobakery-workflows-nextflow/0.0.3
#
# The module sets $BIOBAKERY_NF_PIPELINE and $BIOBAKERY_NF_PARAMS; the latter
# points at the fully annotated conf/harvard_rc.yaml, which is what most people
# should use. This file is the trimmed reference version.
#
# Run (paired-end, mgx is the default workflow):
#   nextflow run $BIOBAKERY_NF_PIPELINE/main.nf -profile harvard_rc \
#     -params-file $BIOBAKERY_NF_PARAMS \
#     --readsdir /path/to/fastqs --outdir /path/to/output -w /path/to/output/work
#
# Run (assembly — MAG/SGB; not the default, so --workflow is required):
#   nextflow run $BIOBAKERY_NF_PIPELINE/main.nf -profile harvard_rc \
#     -params-file $BIOBAKERY_NF_PARAMS --workflow assembly \
#     --readsdir /path/to/fastqs --outdir /path/to/output -w /path/to/output/work
#
# Keep the work directory on shared storage. Compute nodes cannot see the login
# node's /tmp, and a work dir there fails every task with exit 127.
#
# Any param below can be overridden on the command line: --param_name value

### Input

# readsdir: "/path/to/your/fastqs"
# outdir:   "/path/to/output"

paired_end:  true                        # true for R1+R2, false for single-end
filepattern: "*_R{1,2}*.fastq.gz"        # single-end: "*.fastq.gz"

### Host decontamination (KneadData)

host_genome: "/n/lab_storage/huttenhower_lab/data/kneaddata_databases/hg38"
# Mouse:      "/n/lab_storage/huttenhower_lab/data/kneaddata_databases/mouse_C57BL"
# rRNA:       "/n/lab_storage/huttenhower_lab/data/kneaddata_databases/ribosomal_RNA/SILVA_128_LSUParc_SSUParc_ribosomal_RNA_v0.2"

### Taxonomic profiling (MetaPhlAn)

# metaphlan_4.0.6_fixed selects the v3-style --bowtie2db/--bowtie2out flags,
# which is what the hutlab 4.0.6_vOct22_fixed build expects.
metaphlan_version: "metaphlan_4.0.6_fixed"
metaphlan_db:      "/n/lab_storage/huttenhower_lab/tools/metaphlan4/rocky8/v4.0.6_vOct_fixed/lib/python3.10/site-packages/metaphlan/metaphlan_databases"
metaphlan_index:   "mpa_vOct22_CHOCOPhlAnSGB_202403"

### Functional profiling (HUMAnN)

humann_version: "humann_v4a"
humann_db:      "/n/lab_storage/huttenhower_lab/tools/nextflow/databases/humann4"

### Viral profiling (BAQLaVa) — opt-in

# Requires run_taxonomic_profiling, since BAQLaVa consumes the MetaPhlAn profile.
# BAQLaVa runs HUMAnN internally and is allocated 48 GB by the profile.
run_viral_profiling:      false
baqlava_bypass_depletion: false          # true only for tiny samples (0 prescreen species)

### Strain profiling (StrainPhlAn) — opt-in

run_strain_profiling: false

### Assembly workflow (--workflow assembly)

# checkm2 finds its database through CHECKM2DB, exported by
# rocky8/biobakeryworkflows/3.2, so only the PhyloPhlAn folder is named here.
phylophlan_path: "/n/lab_storage/huttenhower_lab/tools/biobakery_workflows/biobakery_workflows_databases/phylophlan"

# sgb_abundance_type:        "by_sample"   # or by_dataset
# sgb_completeness:          50
# sgb_contamination:         10
# megahit_min_contig_length: 2500
